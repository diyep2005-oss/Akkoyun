name: Osmanli APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Zip dosyasını aç
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname 'Osmanli*' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "HATA: Osmanli ile başlayan zip bulunamadı. Depodaki dosyalar:"
            ls
            exit 1
          fi
          echo "Kullanılan zip: $ZIP"
          unzip -q -o "$ZIP" -d proje
      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon -p proje
      - uses: actions/upload-artifact@v4
        with:
          name: Osmanli-Tarayici-APK
          path: proje/app/build/outputs/apk/debug/*.apk
